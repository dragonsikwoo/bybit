<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>바이비트 USDT 선물 스캐너 v2.6</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0e14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;

    }
    .container {
      max-width: 1320px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 18px;
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 22px;
      color: #f59e0b;
      font-weight: 800;
    }
    .badge {
      background: #10b981;
      color: #06281e;
      font-size: 12px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
    }

      font-size: 13px;
      color: #94a3b8;
    }

    /* 컨트롤 패널 */
    .panel {
      background: #141923;
      border: 1px solid #262f40;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .control-group label {
      color: #94a3b8;
      white-space: nowrap;
    }
    select, input[type="number"] {
      background: #0b0e14;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;

    select:focus, input[type="number"]:focus {

    }
    input[type="number"] {
      width: 64px;
      text-align: center;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      color: #e2e8f0;
      user-select: none;
    }
    .checkbox-label input {
      accent-color: #3b82f6;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    /* 버튼 영역 */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    button {
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-test {
      background: #141923;
      color: #f59e0b;
      border: 1px solid #f59e0b;
    }
    .btn-test:hover {
      background: rgba(245, 158, 11, 0.12);
    }
    .btn-scan {
      background: #f59e0b;
      color: #0b0e14;
      border: 1px solid #f59e0b;
    }
    .btn-scan:hover {
      background: #fbbf24;
    }
    .btn-scan:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 상태바 & 프로그레스바 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .progress-track {
      width: 100%;
      height: 4px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #f59e0b;
      transition: width 0.2s ease;
    }

    /* 테이블 */
    .table-wrap {
      background: #141923;
      border: 1px solid #262f40;
      border-radius: 12px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1040px;
      font-size: 13px;
    }
    th {
      background: #1a2130;
      color: #94a3b8;
      font-weight: 600;
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid #262f40;
      white-space: nowrap;
    }
    td {
      padding: 12px 14px;
      border-bottom: 1px solid #1e293b;
      vertical-align: middle;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }
    .empty-msg {
      color: #64748b;
      padding: 28px 14px;
      text-align: left;
    }
    .symbol {
      font-weight: 700;
      color: #f8fafc;
    }
    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      margin-right: 4px;
    }
    .tag-long {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .tag-short {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .up { color: #34d399; font-weight: 600; }
    .down { color: #f87171; font-weight: 600; }
    .muted { color: #94a3b8; }
    .sub-metric {
      font-size: 11px;
      margin-top: 2px;
    }
    .tp-sl-box {
      font-size: 12px;
      line-height: 1.45;
      white-space: nowrap;
    }
    .chart-link {
      display: inline-block;
      padding: 5px 10px;
      background: #1e293b;
      color: #38bdf8;
      text-decoration: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .chart-link:hover {
      background: #334155;
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .btn-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-row">
        <h1>⚡ 바이비트 USDT 선물 스캐너</h1>
        <span class="badge">v2.6</span>
      </div>
      <p class="subtitle">BB 수렴 폭발 · EMA20/장악형 신호와 함께 RSI(14), OI, 펀딩비 및 ATR(14) 기반 손익비 1:2 자동 타점(SL/TP)을 계산합니다.</p>
    </header>

    <div class="panel">
      <div class="controls-row">
        <div class="control-group">
          <label for="mode">모드:</label>
          <select id="mode">
            <option value="bb">수렴 후 폭발 초입 (BB 돌파)</option>
            <option value="trend">추세 전환 (EMA20 / 장악형)</option>
            <option value="all">전체 신호 (둘 다)</option>
          </select>
        </div>

        <div class="control-group">
          <label for="interval">봉:</label>
          <select id="interval">
            <option value="5">5분봉</option>
            <option value="15">15분봉</option>
            <option value="60">1시간봉</option>
          </select>
        </div>

        <div class="control-group">
          <label for="limit">범위:</label>
          <select id="limit">
            <option value="80">상위 80개</option>
            <option value="30">상위 30개</option>
            <option value="50">상위 50개</option>
          </select>
        </div>

        <div class="control-group">
          <label for="volMult">거래량:</label>
          <input type="number" id="volMult" value="5" min="1" max="50" step="0.5" />
          <span>배↑</span>
        </div>

        <div class="control-group">
          <label for="atrMult">SL(ATR):</label>
          <input type="number" id="atrMult" value="1.5" min="0.5" max="5" step="0.1" />
          <span>배</span>
        </div>

        <div class="control-group">
          <label for="direction">방향:</label>
          <select id="direction">
            <option value="all">전체</option>
            <option value="long">상승(롱)</option>
            <option value="short">하락(숏)</option>
          </select>
        </div>

        <div class="control-group">
          <label for="candleType">기준:</label>
          <select id="candleType">
            <option value="closed">마감된 봉</option>
            <option value="live">진행 중 봉</option>
          </select>
        </div>

        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="autoScan" checked /> 1분 자동
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="useSound" checked /> 🔔 띠띠 소리
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="useVibrate" checked /> 📳 진동
          </label>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-test" id="btnTest">🔔 소리/진동 테스트</button>
        <button class="btn-scan" id="btnScan">스캔 시작</button>
      </div>
    </div>

    <div class="status-bar">
      <span id="statusText">대기 중... 스캔 시작을 눌러주세요.</span>
      <span id="updateTime">갱신: -</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>종목</th>
            <th>포착 신호</th>
            <th>현재가</th>
            <th>추천 타점 (1:2)</th>
            <th>거래량</th>
            <th>RSI(14)</th>
            <th>OI / 펀딩비</th>
            <th>등락률</th>
            <th>거래대금</th>
            <th>선물 차트</th>
          </tr>
        </thead>
        <tbody id="resultBody">
          <tr>
            <td colspan="10" class="empty-msg">
              스캔 시작 버튼을 눌러 종목을 탐색하세요.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 모바일 호환 AudioContext & 진동 모듈
    // ==========================================
    let audioCtx = null;

    function unlockAudio() {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
      } catch (e) {
        console.warn('Audio unlock failed:', e);
      }
    }

    ['touchstart', 'click'].forEach(evt => {
      document.addEventListener(evt, unlockAudio, { once: true });
    });

    function playBeep() {
      try {
        unlockAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        [0, 0.22].forEach(offset => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now + offset);

          gain.gain.setValueAtTime(0.001, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.4, now + offset + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.16);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now + offset);
          osc.stop(now + offset + 0.17);
        });
      } catch (e) {
        console.warn('Beep error:', e);
      }
    }

    function triggerVibrate() {
      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200]);
      }
    }

    function triggerAlert() {
      if (document.getElementById('useSound').checked) {
        playBeep();
      }
      if (document.getElementById('useVibrate').checked) {
        triggerVibrate();
      }
    }

    // ==========================================
    // 2. 기술적 지표 계산 함수
    // ==========================================
    function calcSMA(arr, period) {
      if (arr.length < period) return null;
      const slice = arr.slice(-period);
      return slice.reduce((a, b) => a + b, 0) / period;
    }

    function calcEMA(arr, period) {
      if (arr.length < period) return null;
      const k = 2 / (period + 1);
      let ema = arr.slice(0, period).reduce((a, b) => a + b, 0) / period;
      for (let i = period; i < arr.length; i++) {
        ema = arr[i] * k + ema * (1 - k);
      }
      return ema;
    }

    function calcBB(closes, period = 20, mult = 2) {
      if (closes.length < period) return null;
      const slice = closes.slice(-period);
      const mean = slice.reduce((a, b) => a + b, 0) / period;
      const variance = slice.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / period;
      const std = Math.sqrt(variance);
      const upper = mean + mult * std;
      const lower = mean - mult * std;
      const bandwidth = (upper - lower) / mean;
      return { mean, upper, lower, bandwidth };
    }

    // Wilder's Smoothing 기반 RSI(14)
    function calcRSI(closes, period = 14) {
      if (closes.length <= period) return null;
      let gains = 0;
      let losses = 0;

      for (let i = 1; i <= period; i++) {
        const diff = closes[i] - closes[i - 1];
        if (diff >= 0) gains += diff;
        else losses -= diff;
      }

      let avgGain = gains / period;
      let avgLoss = losses / period;

      for (let i = period + 1; i < closes.length; i++) {
        const diff = closes[i] - closes[i - 1];
        const gain = diff > 0 ? diff : 0;
        const loss = diff < 0 ? -diff : 0;
        avgGain = (avgGain * (period - 1) + gain) / period;
        avgLoss = (avgLoss * (period - 1) + loss) / period;
      }

      if (avgLoss === 0) return 100;
      const rs = avgGain / avgLoss;
      return 100 - (100 / (1 + rs));
    }

    // Wilder's Smoothing 기반 ATR(14) (트레이딩뷰 동일 방식)
    function calcATR(highs, lows, closes, period = 14) {
      if (closes.length <= period) return null;
      const trs = [];
      for (let i = 1; i < closes.length; i++) {
        const tr = Math.max(
          highs[i] - lows[i],
          Math.abs(highs[i] - closes[i - 1]),
          Math.abs(lows[i] - closes[i - 1])
        );
        trs.push(tr);
      }
      if (trs.length < period) return null;

      let atr = trs.slice(0, period).reduce((a, b) => a + b, 0) / period;
      for (let i = period; i < trs.length; i++) {
        atr = (atr * (period - 1) + trs[i]) / period;
      }
      return atr;
    }

    // 현재가 문자열의 소수점 자릿수에 맞춰 가격 포맷팅
    function getDecimals(priceStr) {
      const parts = String(priceStr).split('.');
      return parts.length === 2 ? parts[1].length : 0;
    }

    function formatTurnover(val) {
      const num = Number(val);
      if (isNaN(num)) return '-';
      if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
      if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
      if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
      return num.toLocaleString();
    }

    // ==========================================
    // 3. 바이비트 API 스캔 로직
    // ==========================================
    let autoTimer = null;
    let isScanning = false;

    async function runScan() {
      if (isScanning) return;
      isScanning = true;

      const btnScan = document.getElementById('btnScan');
      const statusText = document.getElementById('statusText');
      const updateTime = document.getElementById('updateTime');
      const progressFill = document.getElementById('progressFill');
      const resultBody = document.getElementById('resultBody');

      const mode = document.getElementById('mode').value;
      const interval = document.getElementById('interval').value;
      const limit = parseInt(document.getElementById('limit').value, 10);
      const volMult = parseFloat(document.getElementById('volMult').value) || 1.5;
      const atrMult = parseFloat(document.getElementById('atrMult').value) || 1.5;
      const direction = document.getElementById('direction').value;
      const candleType = document.getElementById('candleType').value;

      btnScan.disabled = true;
      btnScan.textContent = '스캔 중...';
      statusText.textContent = '바이비트 상위 종목 불러오는 중...';
      progressFill.style.width = '5%';

      try {
        const tickerRes = await fetch('https://api.bybit.com/v5/market/tickers?category=linear');
        const tickerJson = await tickerRes.json();
        if (tickerJson.retCode !== 0) throw new Error(tickerJson.retMsg);

        const usdtList = tickerJson.result.list
          .filter(t => t.symbol.endsWith('USDT'))
          .sort((a, b) => parseFloat(b.turnover24h) - parseFloat(a.turnover24h))
          .slice(0, limit);

        const hits = [];
        const batchSize = 8;

        for (let i = 0; i < usdtList.length; i += batchSize) {
          const batch = usdtList.slice(i, i + batchSize);
          await Promise.all(batch.map(async (ticker) => {
            try {
              const klineUrl = `https://api.bybit.com/v5/market/kline?category=linear&symbol=${ticker.symbol}&interval=${interval}&limit=45`;
              const res = await fetch(klineUrl);
              const json = await res.json();
              if (json.retCode !== 0 || !json.result.list || json.result.list.length < 30) return;

              const raw = json.result.list.slice().reverse();
              const candles = candleType === 'closed' ? raw.slice(0, -1) : raw;
              if (candles.length < 25) return;

              const opens = candles.map(c => parseFloat(c[1]));
              const highs = candles.map(c => parseFloat(c[2]));
              const lows = candles.map(c => parseFloat(c[3]));
              const closes = candles.map(c => parseFloat(c[4]));
              const vols = candles.map(c => parseFloat(c[5]));

              const idx = candles.length - 1;
              const curOpen = opens[idx];
              const curClose = closes[idx];
              const curVol = vols[idx];

              const prevOpen = opens[idx - 1];
              const prevClose = closes[idx - 1];

              const avgVol = calcSMA(vols.slice(0, idx), 20);
              if (!avgVol || avgVol === 0) return;
              const volRatio = curVol / avgVol;
              if (volRatio < volMult) return;

              const bbCur = calcBB(closes, 20, 2);
              const bbPrev = calcBB(closes.slice(0, idx), 20, 2);
              const ema20Cur = calcEMA(closes, 20);
              const ema20Prev = calcEMA(closes.slice(0, idx), 20);
              const rsi14 = calcRSI(closes, 14);
              const atr14 = calcATR(highs, lows, closes, 14);

              if (!bbCur || !bbPrev || !ema20Cur || !ema20Prev) return;

              const signals = [];

              if (mode === 'bb' || mode === 'all') {
                const isSqueezed = bbPrev.bandwidth < 0.045;
                const isExpanding = bbCur.bandwidth > bbPrev.bandwidth;
                if (isSqueezed && isExpanding) {
                  if (curClose > bbCur.upper && curClose > curOpen) {
                    signals.push({ type: 'long', text: 'BB 상단 폭발(롱)' });
                  } else if (curClose < bbCur.lower && curClose < curOpen) {
                    signals.push({ type: 'short', text: 'BB 하단 폭발(숏)' });
                  }
                }
              }

              if (mode === 'trend' || mode === 'all') {
                const bullEmaCross = prevClose <= ema20Prev && curClose > ema20Cur;
                const bearEmaCross = prevClose >= ema20Prev && curClose < ema20Cur;
                const bullEngulf = prevClose < prevOpen && curClose > curOpen && curOpen <= prevClose && curClose >= prevOpen;
                const bearEngulf = prevClose > prevOpen && curClose < curOpen && curOpen >= prevClose && curClose <= prevOpen;

                if (bullEmaCross || bullEngulf) {
                  signals.push({
                    type: 'long',
                    text: bullEngulf ? '상승 장악형(롱)' : 'EMA20 상향돌파(롱)'
                  });
                } else if (bearEmaCross || bearEngulf) {
                  signals.push({
                    type: 'short',
                    text: bearEngulf ? '하락 장악형(숏)' : 'EMA20 하향돌파(숏)'
                  });
                }
              }

              const filtered = signals.filter(s => direction === 'all' || s.type === direction);
              if (filtered.length > 0) {
                const price = parseFloat(ticker.lastPrice);
                const decimals = getDecimals(ticker.lastPrice);
                const mainDir = filtered[0].type; // 첫 번째 신호 방향 기준

                let slPrice = null;
                let tpPrice = null;
                let riskPct = null;

                if (atr14 && atr14 > 0) {
                  const riskDist = atr14 * atrMult;
                  riskPct = (riskDist / price) * 100;
                  if (mainDir === 'long') {
                    slPrice = Math.max(0, price - riskDist);
                    tpPrice = price + (riskDist * 2);
                  } else {
                    slPrice = price + riskDist;
                    tpPrice = Math.max(0, price - (riskDist * 2));
                  }
                }

                hits.push({
                  symbol: ticker.symbol,
                  signals: filtered,
                  priceStr: ticker.lastPrice,
                  decimals,
                  slPrice,
                  tpPrice,
                  riskPct,
                  volRatio,
                  rsi14,
                  oiValue: parseFloat(ticker.openInterestValue || 0),
                  fundingRate: parseFloat(ticker.fundingRate || 0) * 100,
                  change24h: parseFloat(ticker.price24hPcnt) * 100,
                  turnover24h: parseFloat(ticker.turnover24h)
                });
              }
            } catch (err) {
              // 개별 종목 오류 무시
            }
          }));

          const pct = Math.min(100, Math.round(((i + batch.length) / usdtList.length) * 100));
          progressFill.style.width = pct + '%';
          statusText.textContent = `스캔 중... (${Math.min(i + batch.length, usdtList.length)}/${usdtList.length})`;
        }

        hits.sort((a, b) => b.volRatio - a.volRatio);

        if (hits.length === 0) {
          resultBody.innerHTML = `
            <tr>
              <td colspan="10" class="empty-msg">
                현재 조건에 맞는 종목이 없습니다. (거래량을 1.5배로 낮추거나 '전체 신호'로 확인해보세요)
              </td>
            </tr>
          `;
        } else {
          resultBody.innerHTML = hits.map(item => {
            const tagsHtml = item.signals.map(s =>
              `<span class="tag ${s.type === 'long' ? 'tag-long' : 'tag-short'}">${s.text}</span>`
            ).join('');
            const chgClass = item.change24h >= 0 ? 'up' : 'down';
            const chgSign = item.change24h >= 0 ? '+' : '';
            const tvUrl = `https://www.tradingview.com/chart/?symbol=BYBIT:${item.symbol}.P`;

            // ATR 기반 손익비 1:2 타점 표시
            let tpSlHtml = '<span class="muted">-</span>';
            if (item.slPrice !== null && item.tpPrice !== null) {
              const tpStr = item.tpPrice.toFixed(item.decimals);
              const slStr = item.slPrice.toFixed(item.decimals);
              const rewardPct = (item.riskPct * 2).toFixed(2);
              const riskPctStr = item.riskPct.toFixed(2);
              tpSlHtml = `
                <div class="tp-sl-box">
                  <div class="up">TP ${tpStr} <span class="muted">(+${rewardPct}%)</span></div>
                  <div class="down">SL ${slStr} <span class="muted">(-${riskPctStr}%)</span></div>
                </div>
              `;
            }

            let rsiHtml = '-';
            if (item.rsi14 !== null) {
              const rsiStr = item.rsi14.toFixed(1);
              if (item.rsi14 >= 70) {
                rsiHtml = `<span class="down">${rsiStr} 🔥</span>`;
              } else if (item.rsi14 <= 30) {
                rsiHtml = `<span class="up">${rsiStr} 💧</span>`;
              } else {
                rsiHtml = `<span>${rsiStr}</span>`;
              }
            }

            const fundClass = item.fundingRate >= 0.05 ? 'down' : item.fundingRate <= -0.05 ? 'up' : 'muted';
            const fundSign = item.fundingRate > 0 ? '+' : '';

            return `
              <tr>
                <td class="symbol">${item.symbol}</td>
                <td>${tagsHtml}</td>
                <td>${item.priceStr}</td>
                <td>${tpSlHtml}</td>
                <td><strong>${item.volRatio.toFixed(1)}배</strong></td>
                <td>${rsiHtml}</td>
                <td>
                  <div>OI $${formatTurnover(item.oiValue)}</div>
                  <div class="sub-metric ${fundClass}">펀딩 ${fundSign}${item.fundingRate.toFixed(4)}%</div>
                </td>
                <td class="${chgClass}">${chgSign}${item.change24h.toFixed(2)}%</td>
                <td>$${formatTurnover(item.turnover24h)}</td>
                <td><a class="chart-link" href="${tvUrl}" target="_blank" rel="noopener">차트 보기 ↗</a></td>
              </tr>
            `;
          }).join('');

          triggerAlert();
        }

        statusText.textContent = `완료! ${hits.length}개 포착`;
        updateTime.textContent = `갱신: ${new Date().toLocaleTimeString('ko-KR')}`;
        progressFill.style.width = '100%';
      } catch (e) {
        statusText.textContent = '에러 발생: ' + e.message;
      } finally {
        isScanning = false;
        btnScan.disabled = false;
        btnScan.textContent = '스캔 시작';
      }
    }

    // ==========================================
    // 4. 버튼 및 자동 스캔 이벤트 연결
    // ==========================================
    document.getElementById('btnTest').addEventListener('click', () => {
      unlockAudio();
      triggerAlert();
    });

    document.getElementById('btnScan').addEventListener('click', () => {
      unlockAudio();
      runScan();
      setupAutoScan();
    });

    document.getElementById('autoScan').addEventListener('change', setupAutoScan);

    function setupAutoScan() {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
      }
      if (document.getElementById('autoScan').checked) {
        autoTimer = setInterval(runScan, 60000);
      }
    }
  </script>
</body>
</html>
